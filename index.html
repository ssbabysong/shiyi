<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>拾遗</title>
<meta name="description" content="拾遗 · 随手拾起的灵感：想法、引语、链接、配色和图片。">
<meta name="theme-color" content="#E8EBF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101219" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="拾遗">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">

  <!-- ============ 灵感墙 ============ -->
  <section class="screen" id="screen-wall" data-tab="wall">
    <header class="appbar" id="wallbar">
      <div class="appbar-row">
        <span class="appbar-small">拾遗</span>
        <button class="icon-btn" id="searchToggle" aria-label="搜索">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        </button>
      </div>
      <div class="search-row" id="searchRow" hidden>
        <input id="q" type="search" placeholder="搜索文字、来源、标签、色值" enterkeyhint="search">
        <button class="text-btn" id="searchCancel" type="button">取消</button>
      </div>
      <div class="filters" id="kinds" role="tablist" aria-label="按类型筛选"></div>
    </header>
    <div class="scroll" id="wallScroll">
      <div class="hero">
        <h1>拾遗<span>.</span></h1>
        <p class="hero-sub">随手拾起的光</p>
        <div class="stats">
          <div><strong id="st-total">0</strong><span>枚收藏</span></div>
          <div><strong id="st-week">0</strong><span>本周新增</span></div>
          <div><strong id="st-tags">0</strong><span>个标签</span></div>
        </div>
      </div>
      <div class="active-tag" id="activeTag" hidden></div>
      <div class="empty-note" id="emptyNote" hidden>
        <b>这里会长出你的灵感墙</b>
        <span>虚线框是示例。点下方的 ＋ 收进第一条，示例就会让位。</span>
      </div>
      <div class="board" id="board"></div>
      <p class="none" id="none" hidden>没有符合条件的灵感</p>
    </div>
  </section>

  <!-- ============ 漫游 ============ -->
  <section class="screen" id="screen-wander" data-tab="wander" hidden>
    <header class="appbar plain"><div class="appbar-row"><span class="appbar-title">漫游</span></div></header>
    <div class="scroll wander-wrap">
      <p class="wander-lede" id="wanderLede">从过去的收藏里随机翻出一枚</p>
      <div class="deck" id="deck"></div>
      <div class="wander-actions">
        <button class="pill ghost" id="wanderOpen" type="button">查看详情</button>
        <button class="pill" id="wanderNext" type="button">再翻一枚</button>
      </div>
      <p class="hint">也可以左右滑动卡片</p>
    </div>
  </section>

  <!-- ============ 标签 ============ -->
  <section class="screen" id="screen-tags" data-tab="tags" hidden>
    <header class="appbar plain"><div class="appbar-row"><span class="appbar-title">标签</span></div></header>
    <div class="scroll">
      <ul class="list" id="tagList"></ul>
      <p class="none" id="tagsNone" hidden>还没有标签。收藏时在「标签」里写几个词就会出现在这里。</p>
    </div>
  </section>

  <!-- ============ 我的 ============ -->
  <section class="screen" id="screen-me" data-tab="me" hidden>
    <header class="appbar plain"><div class="appbar-row"><span class="appbar-title">我的</span></div></header>
    <div class="scroll">
      <div class="me-card">
        <div class="me-mark">拾</div>
        <div><b id="meCount">0 枚收藏</b><span id="meSince">从今天开始收集</span></div>
      </div>

      <h2 class="group-title">外观</h2>
      <div class="segmented" id="themeSeg" role="radiogroup" aria-label="外观">
        <button type="button" data-theme-val="system">跟随系统</button>
        <button type="button" data-theme-val="light">浅色</button>
        <button type="button" data-theme-val="dark">深色</button>
      </div>

      <h2 class="group-title">数据</h2>
      <ul class="list">
        <li><button class="row" id="exportBtn" type="button"><span>导出备份</span><small>保存为 JSON 文件，含图片</small></button></li>
        <li><label class="row" for="importFile"><span>从备份恢复</span><small>导入之前导出的 JSON</small></label><input type="file" id="importFile" accept="application/json,.json" hidden></li>
        <li><button class="row danger" id="clearBtn" type="button"><span>清空全部收藏</span><small>无法撤销</small></button></li>
      </ul>

      <h2 class="group-title">安装</h2>
      <ul class="list">
        <li><button class="row" id="installBtn" type="button"><span>添加到主屏幕</span><small id="installHint">像原生 App 一样全屏打开，离线也能用</small></button></li>
      </ul>
      <p class="footnote">所有收藏只保存在这台设备的浏览器里，不会上传到任何服务器。换设备时请用「导出备份」。</p>
    </div>
  </section>

  <!-- ============ 底部标签栏 ============ -->
  <nav class="tabbar" aria-label="主导航">
    <button class="tab" data-go="wall" aria-current="page"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="10" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="6" rx="1.5"/><rect x="3.5" y="16.5" width="7" height="4" rx="1.5"/><rect x="13.5" y="12.5" width="7" height="8" rx="1.5"/></svg><span>灵感</span></button>
    <button class="tab" data-go="wander"><svg viewBox="0 0 24 24"><path d="M3 7h4l9 10h5M3 17h4l2.5-2.8M15.5 9.8 16 9.3V7h5"/><path d="M19 4.5 21.5 7 19 9.5M19 14.5l2.5 2.5-2.5 2.5"/></svg><span>漫游</span></button>
    <button class="fab" id="addBtn" aria-label="收藏新灵感"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-go="tags"><svg viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3-8.7 8.7z"/><circle cx="8" cy="8" r="1.4"/></svg><span>标签</span></button>
    <button class="tab" data-go="me"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.2-3.6 4-5.5 7.5-5.5s6.3 1.9 7.5 5.5"/></svg><span>我的</span></button>
  </nav>
</div>

<!-- ============ 新建（底部抽屉） ============ -->
<div class="sheet-scrim" id="composeScrim" hidden>
  <form class="sheet" id="compose" autocomplete="off" novalidate role="dialog" aria-modal="true" aria-label="收藏新灵感">
    <div class="grabber"></div>
    <div class="sheet-head">
      <button class="text-btn" type="button" id="composeCancel">取消</button>
      <b>收藏新灵感</b>
      <button class="text-btn strong" type="submit" id="composeSave">收进来</button>
    </div>
    <div class="kind-picker" id="kindPicker" role="tablist"></div>
    <div class="fields" id="fields"></div>
  </form>
</div>

<!-- ============ 详情（全屏推入） ============ -->
<section class="detail" id="detail" hidden aria-modal="true" role="dialog">
  <header class="appbar plain detail-bar">
    <div class="appbar-row">
      <button class="icon-btn back" id="detailBack" aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="appbar-small mono" id="detailNo"></span>
      <button class="icon-btn" id="detailShare" aria-label="分享"><svg viewBox="0 0 24 24"><path d="M12 3v12M7.5 7.5 12 3l4.5 4.5"/><path d="M5 12v7.5h14V12"/></svg></button>
    </div>
  </header>
  <div class="scroll" id="detailBody"></div>
</section>

<!-- ============ 确认框 ============ -->
<div class="sheet-scrim" id="confirmScrim" hidden>
  <div class="action-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirmText">
    <div class="action-group">
      <p id="confirmText"></p>
      <button type="button" class="danger" id="confirmOk">删除</button>
    </div>
    <button type="button" class="action-cancel" id="confirmCancel">取消</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
